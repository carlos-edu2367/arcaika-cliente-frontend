<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcaika</title>
    <style>
        body {
            margin: 0;
            background: #030303;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: sans-serif;
            color: #94a3b8;
            font-size: 0.9rem;
        }
    </style>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var parceiro = params.get('parceiro');
            if (parceiro) {
                window.location.replace('/auth/cadastro?parceiro=' + encodeURIComponent(parceiro));
            } else {
                window.location.replace('/');
            }
        })();
    </script>
    <!-- Fallback para JS desativado (não preserva ?parceiro=) -->
    <meta http-equiv="refresh" content="0; url=/">
</head>
<body>
    <p>Redirecionando...</p>
</body>
</html>
